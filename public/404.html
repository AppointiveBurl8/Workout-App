<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Workout Tracker</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so it serves this file for any
      // unmatched path (e.g. a refresh on /Workout-App/tracker). It redirects back
      // to index.html with the original path encoded in the query string; a
      // matching script in index.html restores it before React Router mounts.
      var pathSegmentsToKeep = 1 // keep "/Workout-App"

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
